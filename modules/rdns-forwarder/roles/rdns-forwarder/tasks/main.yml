---
# Use this task (VERY carefully!) to modify the ansible_pull settings of
# running instances previously deployed from this vX.Y release branch.  Note
# that this takes *two* full update cycles: one (using this playbook) to
# update the host_vars file and cron task for next time, and a second to
# actually run the new version of the playbook.
- name: override ansible_pull settings?
  set_fact:
    #ansible_pull_url: https://github.com/techservicesillinois/aws-enterprise-vpc.git
    #ansible_pull_checkout: vX.Y
    dummy_fact: Ansible requires at least one key/value pair here

- name: update ansible_pull settings saved in host vars
  lineinfile:
    dest: /etc/ansible/host_vars/localhost.yml
    regexp: "^{{ item }}: "
    line: "{{ item }}: {{ lookup('vars', item) }}"
  loop:
    - ansible_pull_url
    - ansible_pull_checkout

- ec2_metadata_facts:

- sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value | string }}"
  loop:
    - name: vm.swappiness
      value: 1

- name: install packages
  package: name={{ item }} state=present
  loop:
    - bind
    - amazon-cloudwatch-agent
    - collectd
    - collectd-bind
    # AL2023 doesn't install rsyslog by default, but amazon-cloudwatch-agent
    # can't read from systemd journal
    - rsyslog

- name: configure amazon-cloudwatch-agent
  template:
    dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
    src: opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
    # check JSON syntax
    validate: python3 -m json.tool %s
  notify: reboot

- name: enable amazon-cloudwatch-agent
  service:
    name: amazon-cloudwatch-agent
    enabled: yes
    # upload ansible.log ASAP in case something goes wrong
    state: started

- name: generate rndc.key
  command: /usr/sbin/rndc-confgen -a -u named
  args:
    creates: /etc/rndc.key

# update /var/named/zones.conf
- import_tasks: "zones.yml"
  tags:
    - zones

- name: named.conf
  template:
    dest: /etc/named.conf
    src: etc/named.conf.j2
    validate: /usr/sbin/named-checkconf %s
  notify: rndc reconfig

- name: configure collectd
  template:
    dest: /etc/collectd.conf
    src: etc/collectd.conf
  notify: reboot

- name: logrotate.d/ansible
  template:
    dest: /etc/logrotate.d/ansible
    src: etc/logrotate.d/ansible.j2

- name: update existing packages
  dnf:
    name: '*'
    state: latest
    # https://docs.aws.amazon.com/linux/al2023/ug/managing-repos-os-updates.html
    releasever: latest
  notify: reboot

- name: configure scheduled tasks
  copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
  loop_control:
    label: "{{ item.dest }}"
  loop:
    # perform self-test query for metrics
    - dest: /etc/systemd/system/rdns-forwarder-self-query.service
      content: |
        [Service]
        Type=oneshot
        ExecStart=dig @localhost illinois.edu in a
        StandardOutput=null
        StandardError=null
    - dest: /etc/systemd/system/rdns-forwarder-self-query.timer
      content: |
        [Timer]
        OnCalendar=*:*:0
        AccuracySec=1s
        [Install]
        WantedBy=timers.target

    # update zone configuration (using current playbook)
    - dest: /etc/systemd/system/rdns-forwarder-update-zones.service
      content: |
        [Service]
        Type=oneshot
        ExecStart=ansible-playbook {{ ansible_pull_directory }}/modules/rdns-forwarder/local.yml --tags=zones
        StandardOutput=null
        StandardError=journal
    - dest: /etc/systemd/system/rdns-forwarder-update-zones.timer
      content: |
        [Timer]
        OnCalendar=*:{{ zone_update.minute }}:0
        AccuracySec=1s
        RandomizedDelaySec=30
        [Install]
        WantedBy=timers.target

    # full ansible-pull update (including upstream playbook changes)
    - dest: /etc/systemd/system/rdns-forwarder-update-full.service
      content: |
        [Service]
        Type=oneshot
        ExecStart=ansible-pull --url={{ ansible_pull_url }} --checkout={{ ansible_pull_checkout }} --directory={{ ansible_pull_directory }} modules/rdns-forwarder/local.yml
        StandardOutput=null
        StandardError=journal
        # support async reboot handler
        KillMode=process
    - dest: /etc/systemd/system/rdns-forwarder-update-full.timer
      content: |
        [Timer]
        OnCalendar=*-*-{{ full_update.day }} {{ full_update.hour }}:{{ full_update.minute }}:0
        AccuracySec=1s
        RandomizedDelaySec=30
        [Install]
        WantedBy=timers.target

- name: reload systemd
  systemd:
    daemon_reload: yes

- name: enable at boot
  systemd:
    name: "{{ item }}"
    enabled: yes
  loop:
    - named
    - collectd
    - rdns-forwarder-self-query.timer
    - rdns-forwarder-update-zones.timer
    - rdns-forwarder-update-full.timer
  # trigger a reboot (rather than immediately applying state: started) to make
  # sure *everything* works as intended before we start answering queries
  notify: reboot
