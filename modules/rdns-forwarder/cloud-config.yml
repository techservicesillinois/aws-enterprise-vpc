#cloud-config
#
# Copyright (c) 2021 Board of Trustees University of Illinois
#
# http://cloudinit.readthedocs.io/en/latest/topics/examples.html
# (see also Modules)
#
# Modules run in an order predetermined by /etc/cloud/cloud.cfg.  For human
# convenience, keep this file organized in the same order.
#
# Detailed logs appear in /var/log/cloud-init.log

bootcmd:

# use Amazon DNS locally, to avoid circular dependency (effective immediately,
# first boot only)
#
# NB: 2 is the index of our primary network link from `networkctl list`
- [ cloud-init-per, once, amazon_dns, resolvectl, dns, 2, "${amazon_dns}" ]

write_files:

- path: /etc/systemd/resolved.conf.d/override.conf
  content: |
    # use Amazon DNS locally, to avoid circular dependency
    [Resolve]
    DNS=${amazon_dns}
    Domains=~.

# configure Ansible logging and avoid some warnings
- path: /root/.ansible.cfg
  content: |
    [defaults]
    log_path=${ansible_logfile}
    localhost_warning=no
    interpreter_python=auto_silent
    no_target_syslog=true
    [inventory]
    host_pattern_mismatch=ignore
    inventory_unparsed_warning=no

# host-specific variables for use within Ansible
- path: /etc/ansible/host_vars/localhost.yml
  content: |
    ---
    vpc_cidr: ${vpc_cidr}
    amazon_dns: ${amazon_dns}
    forwarders:
      ${ indent(6, join("\n", formatlist("- %s", forwarders))) }
    ansible_logfile: ${ansible_logfile}
    ansible_pull_directory: ${ansible_pull_directory}
    ansible_pull_url: ${ansible_pull_url}
    ansible_pull_checkout: ${ansible_pull_checkout}
    zone_update:
      minute: "${zone_update_minute}"
    full_update:
      day: "${full_update_day_of_month}"
      hour: "${full_update_hour}"
      minute: "${full_update_minute}"

swap:
  filename: /swapfile
  size: 1G

packages:
- ansible
- git

runcmd:
# initial ansible-pull
- ansible-pull --url=${ansible_pull_url} --checkout=${ansible_pull_checkout} --directory=${ansible_pull_directory} modules/rdns-forwarder/local.yml > /dev/null || (logger "initial ansible-pull failed, will retry in 60s with cloud-init clean --reboot"; sleep 60; cloud-init clean --reboot)
